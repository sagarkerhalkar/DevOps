<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background-color: #1e1e1e; font-family: Arial, sans-serif;">
    <text x="400" y="40" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">Git Branching Strategy</text>
    
    <line x1="100" y1="100" x2="700" y2="100" stroke="#3fb950" stroke-width="4" />
    <text x="80" y="105" fill="#3fb950" font-size="16" font-weight="bold" text-anchor="end">main</text>
    
    <line x1="200" y1="170" x2="300" y2="170" stroke="#f85149" stroke-width="4" />
    <text x="80" y="175" fill="#f85149" font-size="16" font-weight="bold" text-anchor="end">hotfix</text>
    
    <line x1="500" y1="240" x2="650" y2="240" stroke="#a371f7" stroke-width="4" />
    <text x="80" y="245" fill="#a371f7" font-size="16" font-weight="bold" text-anchor="end">release</text>
    
    <line x1="150" y1="310" x2="700" y2="310" stroke="#58a6ff" stroke-width="4" />
    <text x="80" y="315" fill="#58a6ff" font-size="16" font-weight="bold" text-anchor="end">develop</text>
    
    <line x1="250" y1="380" x2="400" y2="380" stroke="#e3b341" stroke-width="4" />
    <text x="80" y="385" fill="#e3b341" font-size="16" font-weight="bold" text-anchor="end">feature</text>
    
    <path d="M 120 100 C 135 100, 135 310, 150 310" stroke="#58a6ff" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
    
    <path d="M 180 100 C 190 100, 190 170, 200 170" stroke="#f85149" stroke-width="3" fill="none" />
    <path d="M 300 170 C 310 170, 310 100, 320 100" stroke="#f85149" stroke-width="3" fill="none" />
    <path d="M 300 170 C 310 170, 310 310, 320 310" stroke="#f85149" stroke-width="3" fill="none" />
    
    <path d="M 230 310 C 240 310, 240 380, 250 380" stroke="#e3b341" stroke-width="3" fill="none" />
    <path d="M 400 380 C 410 380, 410 310, 420 310" stroke="#e3b341" stroke-width="3" fill="none" />
    
    <path d="M 480 310 C 490 310, 490 240, 500 240" stroke="#a371f7" stroke-width="3" fill="none" />
    <path d="M 650 240 C 660 240, 660 100, 670 100" stroke="#a371f7" stroke-width="3" fill="none" />
    <path d="M 650 240 C 660 240, 660 310, 670 310" stroke="#a371f7" stroke-width="3" fill="none" />

    <circle cx="120" cy="100" r="8" fill="#3fb950" />
    <circle cx="180" cy="100" r="8" fill="#3fb950" />
    <circle cx="320" cy="100" r="8" fill="#3fb950" /> <circle cx="670" cy="100" r="8" fill="#3fb950" /> <circle cx="200" cy="170" r="8" fill="#f85149" />
    <circle cx="250" cy="170" r="8" fill="#f85149" />
    <circle cx="300" cy="170" r="8" fill="#f85149" />
    
    <circle cx="500" cy="240" r="8" fill="#a371f7" />
    <circle cx="575" cy="240" r="8" fill="#a371f7" />
    <circle cx="650" cy="240" r="8" fill="#a371f7" />
    
    <circle cx="150" cy="310" r="8" fill="#58a6ff" />
    <circle cx="230" cy="310" r="8" fill="#58a6ff" />
    <circle cx="320" cy="310" r="8" fill="#58a6ff" /> <circle cx="420" cy="310" r="8" fill="#58a6ff" /> <circle cx="480" cy="310" r="8" fill="#58a6ff" />
    <circle cx="670" cy="310" r="8" fill="#58a6ff" /> <circle cx="250" cy="380" r="8" fill="#e3b341" />
    <circle cx="325" cy="380" r="8" fill="#e3b341" />
    <circle cx="400" cy="380" r="8" fill="#e3b341" />

    <text x="670" y="85" fill="#ffffff" font-size="12" text-anchor="middle">v1.1</text>
    <text x="320" y="85" fill="#ffffff" font-size="12" text-anchor="middle">v1.0.1</text>
    
    <rect x="100" y="430" width="600" height="50" fill="#2d2d2d" rx="5" />
    <circle cx="130" cy="455" r="6" fill="#3fb950" /> <text x="145" y="460" fill="#ffffff" font-size="14">Production</text>
    <circle cx="250" cy="455" r="6" fill="#f85149" /> <text x="265" y="460" fill="#ffffff" font-size="14">Bug Fix</text>
    <circle cx="350" cy="455" r="6" fill="#a371f7" /> <text x="365" y="460" fill="#ffffff" font-size="14">Pre-Release</text>
    <circle cx="480" cy="455" r="6" fill="#58a6ff" /> <text x="495" y="460" fill="#ffffff" font-size="14">Integration</text>
    <circle cx="600" cy="455" r="6" fill="#e3b341" /> <text x="615" y="460" fill="#ffffff" font-size="14">New Work</text>
